rsity problem-solving sessions</text><rect x="640.0" y="254" width="3" height="20" rx="1.5" fill="url(#accent)"/><text x="656.0" y="269" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="16" fill="#9DA7B3" xml:space="preserve"><tspan font-weight="700" fill="#F0F3F6">GDSC</tspan>  taught Java, from basics to advanced topics</text><rect x="640.0" y="302" width="3" height="20" rx="1.5" fill="url(#accent)"/><text x="656.0" y="317" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="16" fill="#9DA7B3" xml:space="preserve"><tspan font-weight="700" fill="#F0F3F6">LeetCode</tspan>  my solutions are written in C#</text>
